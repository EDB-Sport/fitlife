# API, integration, end-to-end and mock-server tests with Newman against the compose stack (issue #22).
# The logic is in tools/ci/api-tests.sh, which runs the same way locally.
#
# It stays a workflow of its own: the group has not decided to move the job into ci.yml, and doing so
# is a separate change that must keep the required check name (#283).
# Make "api-tests" a required check on develop and main (repo ruleset, done by hand).
name: api-tests

on:
  push:
    branches: [develop, main]
  pull_request:

# A new push to a PR cancels its run in progress. Runs on develop and main are never cancelled (issue #136).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Newman and the htmlextra reporter (pinned)
        run: npm install --global newman@6.2.3 newman-reporter-htmlextra@1.23.1
      - name: api-tests
        run: tools/ci/summarize.sh api-tests "Open the Newman HTML report artifact for the failing request, or run tools/ci/api-tests.sh locally." -- tools/ci/api-tests.sh
      - name: Upload the Newman reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-reports
          path: newman-reports/
          if-no-files-found: ignore
