# API, integration, end-to-end and mock-server tests with Newman against the compose stack (issue #22).
# The logic is in tools/ci/api-tests.sh, which runs the same way locally.
#
# A workflow of its own until ci.yml (#5, PR #52) is on develop: then this job moves into ci.yml as job 10
# (docs/CSHARP_SETUP_TODO.md section 10) and this file is deleted.
# Make "api-tests" a required check on develop and main (repo ruleset, done by hand).
name: api-tests

on:
  push:
    branches: [develop, main]
  pull_request:

# A new push to a PR cancels its run in progress. Runs on develop and main are never cancelled (issue #136).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Newman and the htmlextra reporter (pinned)
        run: npm install --global newman@6.2.3 newman-reporter-htmlextra@1.23.1
      - name: api-tests
        run: tools/ci/api-tests.sh
      - name: Upload the Newman reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newman-reports
          path: newman-reports/
          if-no-files-found: ignore
