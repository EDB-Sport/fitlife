# CI on every PR and on every push to develop and main (issue #5, docs/TECHNICAL_REFERENCE.md section 10).
# Pushes to other branches get CI through their PR, so a PR head has one run, not a push run
# plus a PR run with diff-scan skipped (GitHub reports a skipped job as passing).
# Every job here is meant to be a required check on develop and main, by its job name (section 9).
# Every check step runs through tools/ci/summarize.sh (#132, #376): a failure writes a short summary to the
# run summary page and an annotation that gh run view lists. ci-scripts annotates each failing script by name.
# tdd-check and pr-description have their own workflows; security, deploy-check and api-tests
# come through their own issues (#20, #21, #22).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run in progress. Push runs on develop and main always run to the end,
# so every merge gets a verdict (issue #131), as in security.yml.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore from the lock files
        run: dotnet restore --locked-mode

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - name: Build (compiler, analyzers, TEAM rules)
        run: tools/ci/summarize.sh build "Fix the first compiler or analyzer error, the others often follow from it. Run dotnet build -c Release locally." -- dotnet build -c Release --no-restore -v q -clp:NoSummary -tl:off

  format:
    # After build, so one compile error fails build only and is shown once (issue #134)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - name: Check formatting
        run: tools/ci/summarize.sh format "Run dotnet format locally and commit what it changes." -- dotnet format --verify-no-changes --no-restore

  test:
    # After build, so one compile error fails build only and is shown once (issue #134)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -v q -clp:NoSummary -tl:off
      - name: Test with coverage
        run: tools/ci/summarize.sh test "Run the named test with dotnet test -c Release --filter, and read its Error Message." -- dotnet test -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@70c37c4d588cff5bf9cf190830c6f01dfcfb884b # v5.6.1
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Html
      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report

  # The committed OpenAPI contracts match the code (issue #90, section 8): every API change shows in the PR diff.
  # Then no contract breaks the one at its service's last <service>/vX.Y.Z tag (issue #91).
  contract:
    needs: build # one compile error fails build only (#322)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags are needed for the breaking-change check
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - name: Regenerate the contracts and compare them with the commit
        run: tools/ci/summarize.sh contract "Run tools/ci/check-contracts.sh locally and commit the regenerated contracts." -- tools/ci/check-contracts.sh
      - name: No breaking change since each service's last release (oasdiff)
        run: tools/ci/summarize.sh contract "A contract breaks its service's last release. Keep the old shape, or release a new major version." -- tools/ci/oasdiff-breaking.sh

  # Runs the tests of the CI scripts and the dev tools (tools/dev, #488), so a change to a script fails its own tests.
  ci-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0; mutation.test.sh builds and mutates a throwaway project
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      # actionlint on the workflows and shellcheck on tools/ and deploy/ scripts, from pinned images (#273).
      - name: Static checks (actionlint, shellcheck)
        run: tools/ci/static-check.sh
      - name: Run every tools/ci/*.test.sh
        run: |
          status=0
          for test in tools/ci/*.test.sh tools/dev/*.test.sh; do
            echo "::group::$test"
            if ! "$test"; then
              status=1
              echo "::error title=ci-scripts::$test failed. Run it locally and read its FAIL lines."
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # The executable acceptance check for the build rules (#3): builds throwaway projects and
  # checks that each rule in Directory.Build.* still fails the build (issue #54).
  build-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - name: Check that every build rule still fails the build
        run: tools/ci/summarize.sh build-rules "A build rule in Directory.Build.* no longer fails the build. Run tools/ci/check-build-rules.sh locally." -- tools/ci/check-build-rules.sh

  # Fails a PR into develop that is built on another open PR's branch (issue #110, #106).
  # Needs: pull-requests read to list the open PRs. On a draft PR it runs like on any other PR.
  # On a PR from a fork it still checks the commits, but a fork's branch is never a parent.
  stack-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history of every branch, to see what is beneath this PR
      - name: Look for commits of another open PR
        run: tools/ci/summarize.sh stack-check "This branch holds commits of another open PR. Rebase it on develop, or wait for that PR to merge." -- tools/ci/stack-check.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Stryker on the C# files the PR changes; fails below the break threshold in stryker-config.json (issue #53).
  # DISABLED 2026-11-25 (owner's call): it was the CI bottleneck (8-22 min per service PR, whole-file
  # mutation, whole-solution builds) and gave no useful signal yet. A skipped job still satisfies the
  # required check. Re-enable as #385 lists: restore the original condition below and set
  # FITLIFE_MUTATION: 1 in the ci-scripts env, the one switch that runs mutation.test.sh (#461).
  # Original condition: if: github.event_name == 'pull_request'
  mutation:
    # Nothing triggers workflow_dispatch, so this never runs (actionlint rejects a constant `if: false`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Measured (issue #335): service PRs with Testcontainers integration tests take 8-20 min (max 20.2 min).
    # Don't tighten this by the "2-3x normal run time" rule; a 10-minute limit cancelled them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base branch
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true # NuGet global-packages from the Actions cache, keyed on the lock files (#601)
          cache-dependency-path: '**/packages.lock.json'
      - name: Mutation testing on the changed C# files
        run: tools/ci/summarize.sh mutation "Add a test that kills the surviving mutants listed in the mutation report." -- tools/ci/mutation.sh
        env:
          SINCE: origin/${{ github.base_ref }}
      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: StrykerOutput/*/reports/
          if-no-files-found: ignore

  diff-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit
      - name: Scan the lines this PR adds
        id: scan
        run: tools/ci/summarize.sh diff-scan "A line this PR adds matches a scan rule. Remove it, or read the rule in tools/ci/diff-scan.sh." -- tools/ci/diff-scan.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Add the review labels
        # Labels are added even when the scan fails, so reviewers see them either way
        if: ${{ !cancelled() && steps.scan.outputs.labels != '' }}
        run: gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ steps.scan.outputs.labels }}
