# Broken deployment files fail on the PR, not during a deploy (issue #21).
# Compose config, nginx -t on the rendered gateway template, no :latest images, gcx lint of the Grafana
# files, az bicep build/lint, and the acceptance checks deploy/**/*.test.sh (#77). The logic is in tools/ci/deploy-check.sh, which runs the same way locally.
#
# It stays a workflow of its own: the group has not decided to move the job into ci.yml, and doing so
# is a separate change that must keep the required check name (#283).
# Make "deploy-check" a required check on develop and main (repo ruleset, done by hand).
name: deploy-check

# One run per PR update: "push" is only a backstop for direct pushes and merges to the shared
# branches, "pull_request" checks the PR's own commits.
on:
  push:
    branches: [develop, main]
  pull_request:

# A new push to a PR cancels its run in progress. Runs on develop and main are never cancelled (issue #602).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needs only bash, git, jq, python3 and Docker Compose v2, which the runner has. Every tool runs in a
      # pinned container; the versions are at the top of the script.
      - name: deploy-check
        run: tools/ci/deploy-check.sh
