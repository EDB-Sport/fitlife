# Images of develop (issue #340, docs/TECHNICAL_REFERENCE.md section 9, METHODOLOGY section 2.1).
# On every push to develop, each service that changed is built, scanned by Trivy (the settings of release.yml) and
# pushed to Docker Hub as <service>:develop and <service>:sha-<short>, so develop is always deployable to the test
# environment (the compose stack: deploy/compose/compose.develop.yml). Never latest and never an X.Y.Z tag: those
# belong to the release (release.yml). Logic: tools/ci/develop-plan.sh.
#
# Uses what the release already has: the repository variable DOCKERHUB_NAMESPACE and the secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN. No other secret.
name: develop-images

on:
  push:
    branches: [develop]

permissions:
  contents: read

# A run is never cancelled halfway. GitHub keeps one pending run per group and cancels an older pending one, so a push
# can lose its run; the next run makes it up, because the plan compares with the delivered images, not with the push
concurrency:
  group: develop-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits the delivered images were built from are needed
      - name: Which services this push changed
        id: plan
        run: tools/ci/develop-plan.sh
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

  images:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one service's failure doesn't stop the others' images
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.service.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags develop and sha-<short>
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=sha-
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/${{ matrix.service.name }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
      # Scanned before the push, so an image with HIGH or CRITICAL findings never reaches Docker Hub
      - name: Trivy scan (HIGH and CRITICAL fail the push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:develop
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.2 # the Trivy binary; the action's default is v0.70.0, and Dependabot bumps only the action (#526)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Pushes the loaded, scanned image under both tags: no second build, so what Trivy scanned is what ships
      - name: Push the scanned image
        run: docker push --all-tags "$IMAGE"
