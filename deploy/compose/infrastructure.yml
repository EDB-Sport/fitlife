# Infrastructure group: MongoDB, RabbitMQ, Vault and the mock server that stands in for external systems.
# Image versions are pinned, never :latest (docs/TECHNICAL_REFERENCE.md section 7).
# Passwords come from .env (copy .env.example); none are written here.

# The services' databases and secrets. MongoDB creates a user per database from them, and Vault is
# seeded with them, so both read the same list.
x-service-secrets: &service-secrets
  # One database and one user per service (bounded context). mongodb/init/ creates them.
  SERVICE_DATABASES: booking membership identity notification
  BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set it in deploy/compose/.env}
  MEMBERSHIP_DB_PASSWORD: ${MEMBERSHIP_DB_PASSWORD:?set it in deploy/compose/.env}
  IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set it in deploy/compose/.env}
  NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set it in deploy/compose/.env}

services:
  mongodb:
    # MONGO_IMAGE in .env only to work around a host problem, e.g. MongoDB 8 refuses to start on
    # Linux kernels 6.19 to 7.0.13 (older Docker Desktop). See README.md.
    image: ${MONGO_IMAGE:-mongo:8.0.38}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set it in deploy/compose/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set it in deploy/compose/.env}
      <<: *service-secrets
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017" # 27018 on your machine, so a local MongoDB on 27017 doesn't clash
    healthcheck:
      # Ping on the container's own address, not localhost: during first-time init the image runs a
      # temporary mongod on localhost only, so this passes only once the real server is up.
      test: ["CMD-SHELL", "mongosh --quiet \"mongodb://$$(hostname -i):27017\" --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set it in deploy/compose/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set it in deploy/compose/.env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"              # AMQP
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  vault:
    # Dev mode: in memory, unsealed, one root token. vault/start.sh starts the server and writes the
    # secrets from .env into it (vault/seed.sh) on every start, because a restart empties it. The
    # healthcheck passes only once that is done. Not for production (README.md, "Vault").
    image: hashicorp/vault:2.2.2
    user: vault
    entrypoint: ["/bin/sh", "/vault/config/start.sh"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set it in deploy/compose/.env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200 # for the scripts, the healthcheck and `docker compose exec vault vault ...`
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set it in deploy/compose/.env}
      <<: *service-secrets
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set it in deploy/compose/.env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set it in deploy/compose/.env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set it in deploy/compose/.env}
    volumes:
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/seed.sh:/vault/config/seed.sh:ro
    ports:
      - "127.0.0.1:${VAULT_HOST_PORT:-8200}:8200" # API and UI
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vault-seeded && vault status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mock-server:
    # Stands in for the external systems (#279): it serves the saved examples of tests/postman/mocks/*.mock collections,
    # picked by x-mock-response-name or x-mock-response-code as the Postman Mock Server does, so compose and api-tests
    # don't depend on Postman's cloud. The mappings are made by tools/ci/mock-mappings.sh --write (README.md, "Mock server").
    image: wiremock/wiremock:3.13.2-3
    volumes:
      - ./mock-server/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${MOCK_SERVER_HOST_PORT:-8090}:8080" # for the mock-tests collections (environments/ci)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb-data:
  rabbitmq-data:
