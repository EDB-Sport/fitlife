# Services group: the Nginx gateway, and the services and UIs as they are built (#18, #8).
# The gateway is the only entry point: http://localhost:8080 (GATEWAY_PORT in .env).
services:
  gateway:
    image: nginx:1.30.7-alpine
    environment:
      # Rendered into nginx/default.conf.template by the image's envsubst at start.
      # In compose a service is reached by its container name; in Azure by http://127.0.0.1:<port> (section 9a).
      NGINX_RESOLVER: 127.0.0.11 # Docker's internal DNS
      BOOKING_URL: http://booking-svc:8080
      MEMBERSHIP_URL: http://membership-svc:8080
      IDENTITY_URL: http://identity-svc:8080
      MEMBER_PORTAL_URL: http://member-portal:8080 # the Blazor UI (#8), on every path that isn't /api/ or /health
      GRAFANA_URL: http://grafana:3000 # monitoring.yml
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-svc:
    # IdentityService, built from the repo root (src/IdentityService/Dockerfile, #232). Accounts and tokens come
    # in #233 to #235; until then it answers /health only. The gateway routes /api/identity/ here (IDENTITY_URL).
    build:
      context: ../..
      dockerfile: src/IdentityService/Dockerfile
    image: fitlife/identityservice:local
    environment:
      Loki__Url: http://loki:3100 # monitoring.yml; Loki:App is identity-svc in appsettings.json
      # Secrets from Vault (#17): secret/identity-svc (Vault:Path in appsettings.json), loaded at startup.
      # The service waits for Vault and the seed job itself (Vault:WaitSeconds), so it needs no depends_on.
      Vault__Address: http://vault:8200 # infrastructure.yml
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN:?set it in deploy/compose/.env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-svc:
    # BookingService, built from the repo root (src/BookingService/Dockerfile, #93).
    build:
      context: ../..
      dockerfile: src/BookingService/Dockerfile
    image: fitlife/bookingservice:local
    environment:
      Loki__Url: http://loki:3100 # monitoring.yml; Loki:App is booking-svc in appsettings.json
      # Secrets from Vault (#17): secret/booking-svc (Vault:Path in appsettings.json), loaded at startup.
      # The service waits for Vault and the seed job itself (Vault:WaitSeconds), so it needs no depends_on.
      Vault__Address: http://vault:8200 # infrastructure.yml
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN:?set it in deploy/compose/.env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  member-portal:
    # The member portal (Blazor UI, #8), built from the repo root (src/MemberPortal.Web/Dockerfile).
    # The gateway sends it every path that isn't /api/, /health or /grafana/ (MEMBER_PORTAL_URL above, #204).
    build:
      context: ../..
      dockerfile: src/MemberPortal.Web/Dockerfile
    image: fitlife/memberportal:local
    environment:
      Gateway__BaseUrl: http://gateway:80 # where the portal's clients reach the services' APIs (#205 on)
      Loki__Url: http://loki:3100 # monitoring.yml; Loki:App is member-portal in appsettings.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
