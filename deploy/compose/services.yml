# Services group: the Nginx gateway, and the services and UIs as they are built (#18, #8).
# The gateway is the only entry point: http://localhost:8080 (GATEWAY_PORT in .env).
services:
  gateway:
    image: nginx:1.30.7-alpine
    environment:
      # Rendered into nginx/default.conf.template by the image's envsubst at start.
      # In compose a service is reached by its container name; in Azure by http://127.0.0.1:<port> (section 9a).
      NGINX_RESOLVER: 127.0.0.11 # Docker's internal DNS
      BOOKING_URL: http://booking-svc:8080
      MEMBERSHIP_URL: http://membership-svc:8080
      IDENTITY_URL: http://identity-svc:8080
      MEMBER_PORTAL_URL: http://member-portal:8080 # the Blazor UI (#8), on every path that isn't /api/ or /health
      GRAFANA_URL: http://grafana:3000 # monitoring.yml
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-svc:
    # BookingService, built from the repo root (src/BookingService/Dockerfile, #93).
    build:
      context: ../..
      dockerfile: src/BookingService/Dockerfile
    image: fitlife/bookingservice:local
    environment:
      Loki__Url: http://loki:3100 # monitoring.yml; Loki:App is booking-svc in appsettings.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-svc:
    # NotificationService (#191): consumes ReservationMade from RabbitMQ and logs the notification. No HTTP route
    # in the gateway, nothing calls it.
    build:
      context: ../..
      dockerfile: src/NotificationService/Dockerfile
    image: fitlife/notificationservice:local
    environment:
      Loki__Url: http://loki:3100 # monitoring.yml; Loki:App is notification-svc in appsettings.json
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      MongoDb__Host: mongodb
      MongoDb__Port: "27017"
      # Until the service reads them from Vault (#164), the secrets come from .env like the infrastructure's
      RabbitMq__UserName: ${RABBITMQ_USERNAME:?set it in deploy/compose/.env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?set it in deploy/compose/.env}
      MongoDb__Password: ${NOTIFICATION_DB_PASSWORD:?set it in deploy/compose/.env}
    # No depends_on, so this group still starts on its own: the consumer keeps trying until RabbitMQ answers
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
